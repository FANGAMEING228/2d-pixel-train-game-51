<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
        <title>Pixel Rails — first-person train driver</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg: #14161a;
                --panel: #1d2025;
                --line: #2c3037;
                --fg: #e6e8e3;
                --muted: #8e958c;
                --accent: #e0852a;
                --accent-ink: #1a1206;
                --gold: #f2c94c;
                --font-px: 'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
                color-scheme: dark;
            }

            html { background: var(--bg) }

            body {
                background: var(--bg);
                color: var(--fg);
                font-family: var(--font-px);
                margin: 0;
                padding-block: 20px;
                padding-left: max(16px, env(safe-area-inset-left, 0px));
                padding-right: max(16px, env(safe-area-inset-right, 0px));
            }

            .wrap { max-width: 960px; margin: 0 auto; display: grid; gap: 14px }

            .screen {
                position: relative;
                width: 100%;
                aspect-ratio: 16/9;
                background: #000;
                border: 2px solid var(--line);
                overflow: hidden
            }

            canvas {
                display: block;
                width: 100%;
                height: 100%;
                image-rendering: pixelated;
                image-rendering: crisp-edges
            }

            .overlay {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 10px;
                background: rgba(10, 12, 14, .72);
                text-align: center;
                padding: 12px
            }

            .overlay[hidden] { display: none }

            .overlay h1 {
                margin: 0;
                font-size: clamp(16px, 3.4vw, 30px);
                color: var(--accent);
                text-shadow: 3px 3px 0 #000
            }

            .overlay p { margin: 0; font-size: clamp(8px, 1.4vw, 12px); line-height: 1.7; color: var(--fg); max-width: 46em }

            .menu { display: flex; flex-direction: column; gap: 8px; align-items: center }

            .menu[hidden], .shop[hidden] { display: none }

            .lbl { font-size: 9px; color: var(--muted); letter-spacing: 1px }

            .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center }

            .opt, .btn, .pad, .mute {
                font-family: var(--font-px);
                cursor: pointer
            }

            .opt {
                font-size: 10px;
                padding: 7px 10px;
                background: var(--panel);
                color: var(--fg);
                border: 2px solid var(--line)
            }

            .opt[aria-pressed="true"] {
                background: var(--accent);
                color: var(--accent-ink);
                border-color: var(--accent)
            }

            .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center }

            .btn {
                font-size: 12px;
                padding: 12px 18px;
                background: var(--accent);
                color: var(--accent-ink);
                border: 2px solid var(--accent)
            }

            .btn.alt { background: var(--panel); color: var(--fg); border-color: var(--line) }

            .info { font-size: 9px; color: var(--muted) }
            .info.gold, .gold { color: var(--gold) }

            .shop { display: flex; flex-direction: column; gap: 10px; align-items: center }
            .shop .head { font-size: 11px }
            .shop .item { display: flex; gap: 10px; align-items: center; font-size: 9px }
            .shop .item .nm { width: 12ch; text-align: left; color: var(--fg) }
            .shop .item .ds { color: var(--muted); flex: 1; text-align: left }
            .shop .item button {
                font-family: var(--font-px); font-size: 9px; padding: 6px 8px;
                background: var(--panel); color: var(--gold); border: 2px solid var(--line); cursor: pointer
            }
            .shop .item button:disabled { opacity: .4; cursor: default }

            .pads { display: none; gap: 10px; justify-content: space-between; touch-action: none }
            .pads .grp { display: flex; gap: 10px }
            .pad {
                font-size: 10px;
                color: var(--fg);
                background: var(--panel);
                border: 2px solid var(--line);
                min-width: 62px;
                height: 62px;
                padding: 0 8px;
                user-select: none;
                -webkit-user-select: none;
                touch-action: none
            }
            .pad.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
            .pad.danger { color: #ff6a4d; border-color: #7a2a1c }

            @media (hover: none) and (pointer: coarse) {
                .pads { display: flex }
                .hint { display: none }
            }

            .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap }
            .hint { font-size: 9px; color: var(--muted); line-height: 1.8; margin: 0 }
            .hint b { color: var(--fg) }
            .mute { font-size: 9px; padding: 6px 8px; background: var(--panel); color: var(--fg); border: 2px solid var(--line) }
        </style>
    </head>
    <body>
        <main class="wrap">
            <div class="screen">
                <canvas id="c" width="320" height="180" aria-label="Pixel Rails: first-person train driving game"></canvas>
                <div class="overlay" id="ov">
                    <h1 id="ovTitle">PIXEL RAILS</h1>
                    <p id="ovText">Electric loco cab. Throttle, brakes, signals, stations — drive the line, stop on the mark, keep the speed.</p>
                    <div class="menu" id="menu">
                        <span class="lbl">ROUTE</span>
                        <div class="row" role="group" aria-label="Route">
                            <button class="opt" type="button" data-mode="endless" aria-pressed="true">Endless</button>
                            <button class="opt" type="button" data-mode="timed" aria-pressed="false">Shift 6:00</button>
                        </div>
                        <span class="lbl">WEATHER</span>
                        <div class="row" role="group" aria-label="Weather">
                            <button class="opt" type="button" data-weather="clear" aria-pressed="true">Clear</button>
                            <button class="opt" type="button" data-weather="cloudy" aria-pressed="false">Cloudy</button>
                            <button class="opt" type="button" data-weather="rain" aria-pressed="false">Rain</button>
                            <button class="opt" type="button" data-weather="fog" aria-pressed="false">Fog</button>
                            <button class="opt" type="button" data-weather="night" aria-pressed="false">Night</button>
                        </div>
                        <span class="lbl">TRAIN</span>
                        <div class="row" role="group" aria-label="Train">
                            <button class="opt" type="button" data-train="pass" aria-pressed="true">Passenger</button>
                            <button class="opt" type="button" data-train="freight" aria-pressed="false">Freight</button>
                        </div>
                        <p class="info" id="info"></p>
                        <p class="info gold" id="wallet"></p>
                    </div>
                    <div class="shop" id="shop" hidden>
                        <div class="head">DEPOT · <span class="gold" id="shopMoney"></span></div>
                        <div id="shopList" style="display:grid;gap:6px"></div>
                        <div class="btns">
                            <button class="btn alt" id="shopBack" type="button">Back</button>
                        </div>
                    </div>
                    <div class="btns" id="mainBtns">
                        <button class="btn" id="go" type="button">DRIVE</button>
                        <button class="btn alt" id="shopBtn" type="button">DEPOT</button>
                    </div>
                </div>
            </div>
            <div class="pads" id="pads">
                <div class="grp">
                    <button class="pad" type="button" data-k="thrDown">THR-</button>
                    <button class="pad" type="button" data-k="thrUp">THR+</button>
                    <button class="pad" type="button" data-k="horn">HORN</button>
                </div>
                <div class="grp">
                    <button class="pad danger" type="button" data-k="emerg">EMERG</button>
                    <button class="pad" type="button" data-k="brkDown">BRK-</button>
                    <button class="pad" type="button" data-k="brkUp">BRK+</button>
                </div>
            </div>
            <div class="bar">
                <p class="hint">
                    <b>W / ↑</b> throttle notch up · <b>S / ↓</b> notch down · <b>D / →</b> brake more · <b>A / ←</b> brake less ·
                    <b>SPACE</b> emergency brake · <b>H</b> horn · <b>Enter</b> start
                </p>
                <span>
                    <button class="mute" id="toMenu" type="button">Menu</button>
                    <button class="mute" id="mute" type="button">Sound: on</button>
                </span>
            </div>
        </main>
        <script>
            (() => {
                'use strict';
                const W = 320
                  , H = 180;
                const cvs = document.getElementById('c');
                const ctx = cvs.getContext('2d');
                const img = ctx.createImageData(W, H);
                const buf = new Uint32Array(img.data.buffer);

                /* ---------- colour helpers (ABGR, little endian) ---------- */
                const col = (h) => {
                    const n = parseInt(h.slice(1), 16);
                    return (0xFF000000 | ((n & 255) << 16) | (n & 0xFF00) | ((n >> 16) & 255)) >>> 0;
                };
                const mix = (a, b, t) => {
                    const ar = a & 255, ag = (a >> 8) & 255, ab = (a >> 16) & 255
                      , br = b & 255, bg = (b >> 8) & 255, bb = (b >> 16) & 255;
                    return (0xFF000000 | (((ab + (bb - ab) * t) | 0) << 16) | (((ag + (bg - ag) * t) | 0) << 8) | ((ar + (br - ar) * t) | 0)) >>> 0;
                };
                const shade = (c, d) => {
                    let r = (c & 255) + d, g = ((c >> 8) & 255) + d, b = ((c >> 16) & 255) + d;
                    r = r < 0 ? 0 : r > 255 ? 255 : r;
                    g = g < 0 ? 0 : g > 255 ? 255 : g;
                    b = b < 0 ? 0 : b > 255 ? 255 : b;
                    return (0xFF000000 | (b << 16) | (g << 8) | r) >>> 0;
                };
                const dim = (c, m) => (0xFF000000 | ((((c >> 16) & 255) * m | 0) << 16) | ((((c >> 8) & 255) * m | 0) << 8) | (((c & 255) * m) | 0)) >>> 0;
                const hash = (n) => {
                    n = (n ^ 61) ^ (n >>> 16);
                    n = (n + (n << 3)) | 0;
                    n = n ^ (n >>> 4);
                    n = Math.imul(n, 0x27d4eb2d);
                    n = n ^ (n >>> 15);
                    return (n >>> 0) / 4294967296;
                };
                function rng(seed) {
                    let a = seed >>> 0;
                    return () => {
                        a = (a + 0x6D2B79F5) >>> 0;
                        let t = a;
                        t = Math.imul(t ^ (t >>> 15), t | 1);
                        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                    };
                }
                const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

                /* ---------- weather (palette + light) ---------- */
                const WEATHERS = {
                    clear:  { sky0: '#7fa2d8', sky1: '#e8d9b8', haze: '#e2d8c4', cloud: '#f4efe4', cloudd: '#a9b3cc', clouds: .8, fogK: .2, fogMax: .85, mul: 1, cab: 1 },
                    cloudy: { sky0: '#9aa3ae', sky1: '#d2d6da', haze: '#cdd1d5', cloud: '#e4e7ea', cloudd: '#838c98', clouds: 1, fogK: .22, fogMax: .9, mul: .88, cab: .92 },
                    rain:   { sky0: '#5d6672', sky1: '#a4abb2', haze: '#9aa2a9', cloud: '#b6bcc2', cloudd: '#5d6670', clouds: 1, fogK: .3, fogMax: .93, mul: .74, cab: .8, rain: true, lights: true },
                    fog:    { sky0: '#c4c9cc', sky1: '#d9dcdc', haze: '#d4d7d7', cloud: '#d9dcdc', cloudd: '#c0c5c7', clouds: .2, fogK: .85, fogMax: .96, mul: .9, cab: .9, lights: true },
                    night:  { sky0: '#04081a', sky1: '#121c36', haze: '#0b1326', cloud: '#1a2440', cloudd: '#070c1c', clouds: .4, fogK: .26, fogMax: .88, mul: .16, cab: .42, night: true, lights: true }
                };
                let WX = WEATHERS.clear, WKEY = 'clear', FOGK = .2, FOGMAX = .85;

                /* ---------- palette ---------- */
                let SKY0 = col('#7fa2d8'), SKY1 = col('#e8d9b8'), HAZE = col('#e2d8c4'), CLOUD = col('#f4efe4'), CLOUDD = col('#a9b3cc'), HILL = col('#5b6f4a'), HILL2 = col('#49603e');
                const GRAV = col('#8d8a80'), GRAV2 = col('#847f74'), TIE = col('#4a3c2c'), RAIL = col('#3a3d45'), RAILHI = col('#8a90a0')
                  , CONC = col('#9a968c'), CONC2 = col('#908c82'), YELL = col('#d8b23a'), BALL = col('#767066');

                function applyWeather(key) {
                    WKEY = key;
                    WX = WEATHERS[key];
                    FOGK = WX.fogK;
                    FOGMAX = WX.fogMax;
                    SKY0 = col(WX.sky0);
                    SKY1 = col(WX.sky1);
                    HAZE = col(WX.haze);
                    CLOUD = col(WX.cloud);
                    CLOUDD = col(WX.cloudd);
                    HILL = mix(col('#5b6f4a'), HAZE, WX.night ? .85 : .25);
                    HILL2 = mix(col('#49603e'), HAZE, WX.night ? .85 : .25);
                }

                /* ---------- drawing primitives ---------- */
                function px(x, y, c) {
                    if (x >= 0 && y >= 0 && x < W && y < H)
                        buf[y * W + x] = c;
                }
                function rect(x, y, w, h, c) {
                    x |= 0; y |= 0;
                    const x1 = Math.min(W, x + w), y1 = Math.min(H, y + h);
                    for (let yy = Math.max(0, y); yy < y1; yy++)
                        for (let xx = Math.max(0, x); xx < x1; xx++)
                            buf[yy * W + xx] = c;
                }
                function disc(cx, cy, r, c) {
                    for (let y = -r; y <= r; y++)
                        for (let x = -r; x <= r; x++)
                            if (x * x + y * y <= r * r)
                                px(cx + x, cy + y, c);
                }
                function line(x0, y0, x1, y1, c) {
                    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
                    let err = dx - dy;
                    for (;;) {
                        px(x0, y0, c);
                        if (x0 === x1 && y0 === y1)
                            break;
                        const e2 = 2 * err;
                        if (e2 > -dy) { err -= dy; x0 += sx; }
                        if (e2 < dx) { err += dx; y0 += sy; }
                    }
                }

                /* ---------- 3x5 pixel font ---------- */
                const FONT = {
                    A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110',
                    E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101',
                    I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
                    M: '101111111101101', N: '110101101101101', O: '111101101101111', P: '110101110100100',
                    Q: '010101101011001', R: '110101110101101', S: '011100010001110', T: '111010010010010',
                    U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
                    Y: '101101010010010', Z: '111001010100111',
                    '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001011001111',
                    '4': '101101111001001', '5': '111100111001111', '6': '111100111101111', '7': '111001010010010',
                    '8': '111101111101111', '9': '111101111001111',
                    ' ': '000000000000000', '.': '000000000000010', ',': '000000000010100', ':': '000010000010000',
                    '-': '000000111000000', '+': '000010111010000', '!': '010010010000010', "'": '010010000000000',
                    '/': '001001010100100', '%': '101001010100101', '(': '010100100100010', ')': '010001001001010'
                };
                function text(s, x, y, c, sc) {
                    sc = sc || 1;
                    s = String(s).toUpperCase();
                    let cx = x;
                    for (let i = 0; i < s.length; i++) {
                        const g = FONT[s[i]];
                        if (!g) { cx += 4 * sc; continue; }
                        for (let r = 0; r < 5; r++)
                            for (let q = 0; q < 3; q++)
                                if (g[r * 3 + q] === '1')
                                    for (let dy = 0; dy < sc; dy++)
                                        for (let dx = 0; dx < sc; dx++)
                                            px(cx + q * sc + dx, y + r * sc + dy, c);
                        cx += 4 * sc;
                    }
                }
                const tw = (s, sc) => String(s).length * 4 * (sc || 1) - (sc || 1);

                /* ---------- track geometry ---------- */
                const K = 300, RW = 5, HWK = RW / 2, ROWS = 118, HOR = 62;
                const CEN = new Float32Array(ROWS + 2), HW = new Float32Array(ROWS + 2);
                function cvAt(i) {
                    if (((i % 4) + 4) % 4 === 0 || ((i % 7) + 7) % 7 === 0)
                        return 0;
                    return (rng(i * 13 + 7)() - .5) * .0032;
                }
                function curve(z) {
                    const c = 240, i = Math.floor(z / c), f = z / c - i;
                    const a = cvAt(i), b = cvAt(i + 1), t = f * f * (3 - 2 * f);
                    return a + (b - a) * t;
                }

                /* ---------- bitmap sprite helpers ---------- */
                const mk = (w, h) => ({ w, h, d: new Uint32Array(w * h) });
                const bpx = (b, x, y, c) => { if (x >= 0 && y >= 0 && x < b.w && y < b.h) b.d[y * b.w + x] = c; };
                function brect(b, x, y, w, h, c) {
                    for (let j = 0; j < h; j++)
                        for (let i = 0; i < w; i++)
                            bpx(b, x + i, y + j, c);
                }
                function bline(b, x0, y0, x1, y1, c) {
                    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
                    let err = dx - dy;
                    for (;;) {
                        bpx(b, x0, y0, c);
                        if (x0 === x1 && y0 === y1)
                            break;
                        const e2 = 2 * err;
                        if (e2 > -dy) { err -= dy; x0 += sx; }
                        if (e2 < dx) { err += dx; y0 += sy; }
                    }
                }
                function btext(b, s, x, y, c, sc) {
                    sc = sc || 1;
                    s = String(s).toUpperCase();
                    let cx = x;
                    for (let i = 0; i < s.length; i++) {
                        const g = FONT[s[i]];
                        if (g)
                            for (let r = 0; r < 5; r++)
                                for (let q = 0; q < 3; q++)
                                    if (g[r * 3 + q] === '1')
                                        brect(b, cx + q * sc, y + r * sc, sc, sc, c);
                        cx += 4 * sc;
                    }
                }
                const bdisc = (b, cx, cy, r, c) => {
                    for (let y = -r; y <= r; y++)
                        for (let x = -r; x <= r; x++)
                            if (x * x + y * y <= r * r)
                                bpx(b, cx + x, cy + y, c);
                };

                /* ---------- scenery sprites ---------- */
                function makeTree(seed, leafCol, trunkCol) {
                    const b = mk(26, 30), r = rng(seed);
                    const leaf = (x, y) => {
                        for (let j = -2; j <= 1; j++)
                            for (let i = -2; i <= 2; i++)
                                if (Math.abs(i) + Math.abs(j) < 3.4)
                                    bpx(b, x + i, y + j, shade(leafCol, (r() * 30 - 18) | 0));
                    };
                    const branch = (x, y, a, len, depth) => {
                        if (depth > 4 || len < 2)
                            return;
                        const nx = x + Math.cos(a) * len, ny = y - Math.sin(a) * len;
                        bline(b, x | 0, y | 0, nx | 0, ny | 0, trunkCol);
                        const n = depth < 2 ? 3 : 2;
                        for (let i = 0; i < n; i++)
                            branch(nx, ny, a + (r() - .5) * 1.6, len * (.6 + r() * .25), depth + 1);
                        if (depth >= 2)
                            leaf(nx | 0, ny | 0);
                    };
                    branch(13, 29, Math.PI / 2, 7, 0);
                    return b;
                }
                function makeBush(seed, leafCol) {
                    const b = mk(20, 10), r = rng(seed);
                    for (let i = 0; i < 26; i++) {
                        const x = 2 + (r() * 16) | 0, y = 4 + (r() * 5) | 0, rr = 2 + (r() * 2) | 0;
                        bdisc(b, x, y, rr, shade(leafCol, (r() * 36 - 20) | 0));
                    }
                    brect(b, 0, 9, 20, 1, shade(leafCol, -40));
                    return b;
                }
                function makeHouse(seed, wall, roof) {
                    const b = mk(34, 22), r = rng(seed);
                    brect(b, 2, 10, 30, 12, wall);
                    for (let i = 0; i < 16; i++) {
                        const x = 2 + i * 2;
                        bline(b, x, 10, x + 8, 2, roof);
                        bline(b, x, 9, x + 8, 1, roof);
                    }
                    brect(b, 14, 14, 6, 8, shade(wall, -70));
                    brect(b, 24, 13, 5, 4, mix(col('#20242c'), wall, .25));
                    brect(b, 5, 13, 5, 4, mix(col('#20242c'), wall, .25));
                    return b;
                }
                function makeTower() {
                    const b = mk(30, 34);
                    const DK = col('#5a5f58'), LT = col('#8a8e86');
                    for (const [x, w] of [[4, 2], [24, 2]])
                        brect(b, x, 10, w, 24, DK);
                    for (let j = 0; j < 12; j++) {
                        bpx(b, 6 + j, 12 + j * 1.8 | 0, DK);
                        bpx(b, 24 - j, 12 + j * 1.8 | 0, DK);
                    }
                    bdisc(b, 15, 9, 8, LT);
                    brect(b, 7, 2, 17, 5, DK);
                    bdisc(b, 15, 8, 6, LT);
                    brect(b, 15, 17, 2, 10, DK);
                    return b;
                }
                function makePole() {
                    const b = mk(14, 46);
                    const M = col('#4d4a42'), D = col('#38352f');
                    brect(b, 4, 4, 3, 42, M);
                    brect(b, 5, 4, 1, 42, D);
                    brect(b, 4, 44, 6, 2, D);
                    brect(b, 7, 6, 7, 1, M);
                    brect(b, 7, 10, 7, 1, M);
                    brect(b, 12, 5, 1, 6, D);
                    brect(b, 3, 2, 5, 2, D);
                    return b;
                }
                function makeGantry() {
                    const b = mk(64, 34);
                    const M = col('#4d4a42'), D = col('#38352f');
                    brect(b, 2, 3, 3, 31, M);
                    brect(b, 59, 3, 3, 31, M);
                    brect(b, 2, 3, 60, 2, M);
                    brect(b, 2, 5, 60, 1, D);
                    brect(b, 20, 5, 2, 4, D);
                    brect(b, 42, 5, 2, 4, D);
                    return b;
                }
                function makeSignalBase() {
                    const b = mk(12, 40);

                /* ---------- freight trains on the neighbouring track ---------- */

                /* ---------- update ---------- */

                /* ---------- render: scene ---------- */

                        for (let k = 0; k < f.wag; k++) {
                            const d = f.z - k * f.gap - S.pos;
                            if (d > 6 && d < K)
                                list.push({ d, lat: -1.4, bm: WAGONS[(f.hue + k) % WAGONS.length], w: 3.1, h: 3.7 });
                        }
                    list.sort((a, b) => b.d - a.d);
                    for (const o of list)
                        drawSprite(o.bm, o.d, o.lat, o.w, o.h, o.lift);
                }

                /* ---------- catenary wires ---------- */
                function poleAnchor(z, lift) {
                    const d = z - S.pos;
                    const h = K / d;
                    if (h < 1 || h > ROWS)
                        return null;
                    const i0 = Math.floor(h), f = h - i0;
                    const cen = CEN[i0] * (1 - f) + CEN[i0 + 1] * f, hw = HW[i0] * (1 - f) + HW[i0 + 1] * f;
                    return { x: cen - .55 * hw, y: curHor + h - lift * h };
                }
                function sagLine(a, b, sag, c) {
                    const n = 10;
                    let lx = a.x, ly = a.y;
                    for (let k = 1; k <= n; k++) {
                        const t = k / n
                          , x = a.x + (b.x - a.x) * t
                          , y = a.y + (b.y - a.y) * t + Math.sin(t * Math.PI) * sag;
                        line(lx | 0, ly | 0, x | 0, y | 0, c);
                        lx = x; ly = y;
                    }
                }
                function renderWires() {
                    const p0 = Math.ceil((S.pos + 4) / 55), p1 = Math.floor((S.pos + K) / 55);
                    const WC = mix(dim(col('#2b2d33'), WX.mul), HAZE, .3);
                    for (let i = p0; i < p1; i++) {
                        const z1 = i * 55, z2 = (i + 1) * 55;
                        const a = poleAnchor(z1, 8.8), b = poleAnchor(z2, 8.8);
                        if (a && b) {
                            sagLine(a, b, 1.5, WC);
                            const drop1 = 2.2 * K / (z1 - S.pos), drop2 = 2.2 * K / (z2 - S.pos);
                            sagLine({ x: a.x, y: a.y + drop1 }, { x: b.x, y: b.y + drop2 }, 2.6, WC);
                        }
                    }
                }

                /* ---------- weather fx + light ---------- */
                function renderRain() {
                    if (!WX.rain)
                        return;
                    const t = performance.now() / 1000;
                    for (let i = 0; i < 46; i++) {
                        const sx = hash(i * 7 + 1) * W, sp = .7 + hash(i * 3) * .7
                          , y = ((hash(i * 13) * H + t * 260 * sp) | 0) % (H + 20) - 10
                          , x = (sx + y * .25) | 0;
                        line(x, y, x - 1, y + 4, mix(CLOUD, HAZE, .25));
                    }
                }
                function renderHeadlight() {
                    if (!WX.lights)
                        return;
                    for (let h = 1; h < ROWS; h++) {
                        const y = curHor + h;
                        if (y >= H)
                            break;
                        const d = K / h;
                        if (d > 130)
                            continue;
                        const cen = CEN[h], hw = HW[h], row = y * W
                          , beam = hw * (.62 + d * .004)
                          , br = (1 - d / 130) * (WX.night ? 34 : 16);
                        const x0 = Math.max(0, cen - beam | 0), x1 = Math.min(W - 1, cen + beam | 0);
                        for (let x = x0; x <= x1; x++) {
                            const u = Math.abs(x + .5 - cen) / beam;
                            buf[row + x] = shade(buf[row + x], br * (1 - u * .55) | 0);
                        }
                    }
                }
                function renderFlash() {
                    if (S.flashT > 0 && ((S.flashT * 8 | 0) & 1))
                        for (let y = 0; y < H; y += 2)
                            for (let x = (y & 3); x < W; x += 4)
                                buf[y * W + x] = mix(buf[y * W + x], col('#c02010'), .35);
                }

                /* ---------- cab + live widgets ---------- */
                function drawCab() {
                    if (!cabData)
                        return;
                    const m = WX.cab;
                    for (let i = 0; i < W * H; i++) {
                        const c = cabData[i];
                        if ((c >>> 24) === 255)
                            buf[i] = m < 1 ? dim(c, m) : c;
                    }
                }
                function drawSAUT() {
                    const x0 = SAUT.x0, y0 = SAUT.y0, w = SAUT.x1 - SAUT.x0, h = SAUT.y1 - SAUT.y0;
                    rect(x0, y0, w, h, col('#0a0e0a'));
                    for (let gy = y0 + 6; gy < y0 + h - 8; gy += 7)
                        rect(x0 + 2, gy, w - 4, 1, col('#142a14'));
                    const lim = limitAt(S.pos), over = S.v * 3.6 > lim.lim + 2
                      , gc = over ? (((performance.now() / 160 | 0) & 1) ? col('#ff4020') : col('#37c24e')) : col('#37c24e');
                    text('' + lim.lim, x0 + 3, y0 + 2, gc, 2);
                    text('N' + lim.next, x0 + 16, y0 + 3, col('#1f7a2c'), 1);
                    for (let m = 0; m <= 1200; m += 60) {
                        const l = limitAt(S.pos + m).lim
                          , bx = x0 + 3 + m / 1200 * (w - 8), bh = Math.round(l * .38)
                          , c2 = l > lim.lim ? col('#2a8a3a') : col('#37c24e');
                        rect(bx | 0, y0 + h - 9 - bh, 3, bh, c2);
                    }
                    for (let tx = x0 + 2; tx < x0 + w - 2; tx += 4)
                        rect(tx, y0 + h - 6, 2, 2, col('#1f7a2c'));
                    text('V ' + Math.round(S.v * 3.6), x0 + 3, y0 + h - 14, col('#37c24e'), 1);
                }
                function drawLED() {
                    rect(LED.x0, LED.y0, LED.x1 - LED.x0, LED.y1 - LED.y0, col('#050505'));
                    const kmh = String(Math.round(S.v * 3.6));
                    text(kmh, LED.x0 + 4, LED.y0 + 6, col('#ff2a1a'), 2);
                    const ls = String(limitAt(S.pos).lim);
                    text(ls, LED.x1 - 6 - tw(ls, 1), LED.y0 + 9, col('#39d24a'), 1);
                }
                function drawSpeedo() {
                    const { cx, cy, r } = SPD;
                    disc(cx, cy, r + 2, col('#1d1f1d'));
                    disc(cx, cy, r, col('#ded8c2'));
                    disc(cx, cy, r - 1, col('#d5cfb8'));
                    const kmh = clamp(S.v * 3.6, 0, 160), a0 = 135, sweep = -260;
                    for (let v = 0; v <= 160; v += 10) {
                        const th = (a0 + sweep * v / 160) * Math.PI / 180
                          , major = v % 20 === 0
                          , len = major ? 7 : 4
                          , c2 = v >= 120 ? col('#b0392e') : col('#3a382f');
                        line(cx + Math.cos(th) * (r - 2) | 0, cy + Math.sin(th) * (r - 2) | 0, cx + Math.cos(th) * (r - 2 - len) | 0, cy + Math.sin(th) * (r - 2 - len) | 0, c2);
                        if (v % 40 === 0) {
                            const lx = cx + Math.cos(th) * (r - 14) | 0, ly = cy + Math.sin(th) * (r - 14) | 0;
                            text('' + v, lx - (tw('' + v, 1) / 2 | 0), ly - 2, col('#55503f'), 1);
                        }
                    }
                    text('KM/H', cx - (tw('KM/H', 1) / 2 | 0), cy + 6, col('#6a6455'), 1);
                    const th = (a0 + sweep * kmh / 160) * Math.PI / 180;
                    line(cx + Math.cos(th) * 5 | 0, cy + Math.sin(th) * 5 | 0, cx + Math.cos(th) * (r - 4) | 0, cy + Math.sin(th) * (r - 4) | 0, col('#1c1c1a'));
                    px(cx + Math.cos(th) * (r - 4) | 0, cy + Math.sin(th) * (r - 4) | 0, col('#b0392e'));
                    disc(cx, cy, 3, col('#3a3a36'));
                    px(cx, cy, col('#191917'));
                }

                /* ---------- HUD ---------- */
                function textS(s, x, y, c, sc) {
                    text(s, x + 1, y + 1, col('#101210'), sc);
                    text(s, x, y, c, sc);
                }
                function renderHUD() {
                    const st = stationAt(Math.round((S.pos + 30) / STN_SPACING));
                    if (st && st.z > S.pos - 60) {
                        const dd = Math.max(0, (st.z + 30 - (S.pos + 6)) / 1000);
                        textS('NEXT: ' + st.name, 96, 3, col('#fff3c4'), 1);
                        textS(dd.toFixed(2) + ' KM', 96, 10, col('#e6e8e3'), 1);
                        if (dd < .45)
                            textS('TARGET ' + (st.z + 30 - S.pos - 6 > 0 ? '+' : '') + Math.round(st.z + 30 - S.pos - 6) + 'M', 96, 17, col('#8fd0ff'), 1);
                    } else
                        textS('LINE CLEAR', 96, 3, col('#9fd8a8'), 1);
                    textS('SCORE ' + S.score, 96, 26, col('#e6e8e3'), 1);
                    textS('$' + G.money, 200, 3, col('#f2c94c'), 1);
                    if (S.mode === 'timed') {
                        const t = Math.max(0, Math.ceil(S.time)), mm = Math.floor(t / 60), ss = t % 60;
                        textS(mm + ':' + (ss < 10 ? '0' : '') + ss, 200, 10, t < 60 ? col('#ff6a4d') : col('#e6e8e3'), 2);
                    } else
                        textS((S.dist / 1000).toFixed(1) + ' KM', 200, 10, col('#e6e8e3'), 1);
                    rect(158, 130, 5, 18, col('#1b1e22'));
                    for (let n = 0; n < 8; n++)
                        if (S.notch > n)
                            rect(159, 147 - n * 2, 3, 1, col('#5ecb5e'));
                    text('T', 158, 150, col('#cfd4c9'), 1);
                    rect(166, 130, 5, 18, col('#1b1e22'));
                    const bl = Math.round(S.brake * 8);
                    for (let n = 0; n < bl; n++)
                        rect(167, 147 - n * 2, 3, 1, col('#e04a2a'));
                    text('B', 166, 150, col('#cfd4c9'), 1);
                    if (WX.rain && G.up.snd > 0)
                        textS('SAND', 158, 158, col('#d8c08a'), 1);
                    if (S.msgT > 0 && S.msg) {
                        const w2 = tw(S.msg, 1), x = Math.round((W - w2) / 2), y = 40;
                        text(S.msg, x + 1, y + 1, col('#1b1b1b'), 1);
                        text(S.msg, x, y, col('#fff3c4'), 1);
                    }
                    if (S.dock) {
                        const p = 1 - S.dockT / 4.5;
                        textS('BOARDING', 148, 48, col('#8fd0ff'), 1);
                        rect(138, 56, 44, 4, col('#1b1e22'));
                        rect(139, 57, Math.round(42 * p), 2, col('#5ecb5e'));
                    }
                    if (S.emerg)
                        textS('EMERGENCY', 139, 64, col('#ff6a4d'), 1);
                }

                /* ---------- UI screens ---------- */
                const ov = document.getElementById('ov')
                  , ovTitle = document.getElementById('ovTitle')
                  , ovText = document.getElementById('ovText')
                  , menu = document.getElementById('menu')
                  , shop = document.getElementById('shop')
                  , mainBtns = document.getElementById('mainBtns')
                  , info = document.getElementById('info')
                  , wallet = document.getElementById('wallet')
                  , goBtn = document.getElementById('go')
                  , shopBtn = document.getElementById('shopBtn')
                  , shopList = document.getElementById('shopList')
                  , shopMoney = document.getElementById('shopMoney')
                  , shopBack = document.getElementById('shopBack')
                  , toMenuBtn = document.getElementById('toMenu')
                  , muteBtn = document.getElementById('mute');
                let menuMode = 'endless', menuTrain = 'pass';

                function showMenu() {
                    S.state = 'menu';
                    ov.hidden = false;
                    ovTitle.textContent = 'PIXEL RAILS';
                    ovText.textContent = 'Electric loco cab. Throttle, brakes, signals, stations — drive the line, stop on the mark, keep the speed.';
                    menu.hidden = false;
                    shop.hidden = true;
                    mainBtns.hidden = false;
                    goBtn.textContent = 'DRIVE';
                    updateMenuInfo();
                }
                function updateMenuInfo() {
                    info.textContent = TRAINCFG[menuTrain].info;
                    wallet.textContent = 'WALLET $' + G.money + ' · BEST ' + G.best + ' · BEST RUN ' + (G.bestDist / 1000).toFixed(1) + ' KM';
                }
                function showOver(title) {
                    ov.hidden = false;
                    ovTitle.textContent = title;
                    const rec = S.score >= G.best && S.score > 0 ? ' · NEW RECORD!' : '';
                    ovText.innerHTML = 'Distance ' + (S.dist / 1000).toFixed(2) + ' km · stations stopped ' + S.stops +
                        '<br>Signal violations: ' + S.spads + ' · emergency stops: ' + S.over +
                        '<br>SCORE ' + S.score + rec + ' · WALLET $' + G.money;
                    menu.hidden = true;
                    shop.hidden = true;
                    mainBtns.hidden = false;
                    goBtn.textContent = 'DRIVE AGAIN';
                }
                function renderShop() {
                    shopMoney.textContent = '$' + G.money;
                    shopList.innerHTML = '';
                    for (const u of UPS) {
                        const lv = G.up[u.k], maxed = lv >= u.p.length;
                        const div = document.createElement('div');
                        div.className = 'item';
                        let dots = '';
                        for (let i = 0; i < u.p.length; i++)
                            dots += i < lv ? '●' : '○';
                        div.innerHTML = '<span class="nm">' + u.name + '</span><span class="ds">' + u.d + ' ' + dots + '</span>';
                        const b = document.createElement('button');
                        b.type = 'button';
                        if (maxed) {
                            b.textContent = 'MAX';
                            b.disabled = true;
                        } else {
                            b.textContent = '$' + u.p[lv];
                            b.disabled = G.money < u.p[lv];
                            b.onclick = () => {
                                G.money -= u.p[lv];
                                G.up[u.k]++;
                                saveGame();
                                renderShop();
                                updateMenuInfo();
                            };
                        }
                        div.appendChild(b);
                        shopList.appendChild(div);
                    }
                }
                function openShop() {
                    ov.hidden = false;
                    ovTitle.textContent = 'DEPOT';
                    ovText.textContent = 'Spend money earned on the line. Upgrades apply to every shift.';
                    menu.hidden = true;
                    mainBtns.hidden = true;
                    shop.hidden = false;
                    renderShop();
                }
                shopBack.onclick = () => {
                    ov.hidden = false;
                    ovTitle.textContent = 'PIXEL RAILS';
                    ovText.textContent = 'Electric loco cab. Throttle, brakes, signals, stations — drive the line, stop on the mark, keep the speed.';
                    menu.hidden = false;
                    shop.hidden = true;
                    mainBtns.hidden = false;
                    updateMenuInfo();
                };

                function startGame() {
                    S = newRun(menuMode, menuTrain);
                    applyWeather(WKEY);
                    ov.hidden = true;
                    audioResume();
                    setMsg('GREEN LIGHT — DRIVE', 2.5);
                }
                function endGame(reason) {
                    if (S.score > G.best)
                        G.best = S.score;
                    if (S.dist > G.bestDist)
                        G.bestDist = S.dist;
                    saveGame();
                    showOver(reason);
                    keys.thrUp = keys.thrDown = keys.brkUp = keys.brkDown = keys.emerg = keys.horn = false;
                }

                goBtn.onclick = () => { audioResume(); startGame(); };
                shopBtn.onclick = () => { audioResume(); openShop(); };
                toMenuBtn.onclick = () => { showMenu(); updateMenuInfo(); };
                muteBtn.onclick = () => {
                    muted = !muted;
                    muteBtn.textContent = 'Sound: ' + (muted ? 'off' : 'on');
                };
                for (const b of document.querySelectorAll('.opt')) {
                    b.onclick = () => {
                        const grp = b.parentElement;
                        for (const o of grp.querySelectorAll('.opt'))
                            o.setAttribute('aria-pressed', 'false');
                        b.setAttribute('aria-pressed', 'true');
                        if (b.dataset.mode)
                            menuMode = b.dataset.mode;
                        if (b.dataset.weather)
                            WKEY = b.dataset.weather;
                        if (b.dataset.train)
                            menuTrain = b.dataset.train;
                        applyWeather(WKEY);
                        updateMenuInfo();
                    };
                }

                /* ---------- input ---------- */
                const KEYMAP = {
                    KeyW: 'thrUp', ArrowUp: 'thrUp',
                    KeyS: 'thrDown', ArrowDown: 'thrDown',
                    KeyD: 'brkDown', ArrowRight: 'brkDown',
                    KeyA: 'brkUp', ArrowLeft: 'brkUp',
                    Space: 'emerg', KeyH: 'horn'
                };
                function applyStep(k) {
                    if (S.state !== 'run')
                        return;
                    if (k === 'thrUp')
                        S.notch = Math.min(8, S.notch + 1);
                    else if (k === 'thrDown')
                        S.notch = Math.max(0, S.notch - 1);
                    else if (k === 'brkDown')
                        S.brake = clamp(S.brake + .2, 0, 1);
                    else if (k === 'brkUp')
                        S.brake = clamp(S.brake - .2, 0, 1);
                    else if (k === 'emerg')
                        keys.emerg = true;
                    else if (k === 'horn')
                        S.hornT = 1.1;
                }
                addEventListener('keydown', (e) => {
                    if (e.code === 'Enter') {
                        if (!ov.hidden && shop.hidden) {
                            audioResume();
                            startGame();
                        }
                        e.preventDefault();
                        return;
                    }
                    if (e.code === 'KeyM') {
                        muteBtn.onclick();
                        return;
                    }
                    const k = KEYMAP[e.code];
                    if (k) {
                        if (!e.repeat)
                            applyStep(k);
                        if (k === 'emerg' || k === 'horn' || k.startsWith('thr') || k.startsWith('brk'))
                            e.preventDefault();
                    }
                });
                for (const p of document.querySelectorAll('.pad')) {
                    const k = p.dataset.k;
                    p.addEventListener('pointerdown', (e) => {
                        audioResume();
                        applyStep(k);
                        p.classList.add('on');
                        e.preventDefault();
                    });
                    const off = () => p.classList.remove('on');
                    p.addEventListener('pointerup', off);
                    p.addEventListener('pointerleave', off);
                    p.addEventListener('pointercancel', off);
                }
                cvs.addEventListener('pointerdown', () => audioResume());

                /* ---------- loop ---------- */
                let curvePull = 0;
                S = newRun('endless', 'pass');
                S.state = 'menu';
                applyWeather('clear');
                let last = 0, acc = 0;
                function frame(t) {
                    const dt = Math.min(.1, (t - last) / 1000 || .016);
                    last = t;
                    if (S.state === 'run') {
                        acc += dt;
                        let n = 0;
                        while (acc >= 1 / 60 && n < 6) {
                            update(1 / 60);
                            acc -= 1 / 60;
                            n++;
                        }
                    } else {
                        /* attract mode: slow roll behind the overlay */
                        S.v = 7;
                        S.notch = 1;
                        S.brake = 0;
                        S.pos += S.v * dt;
                        S.bump = Math.sin(S.pos * .9) * .5;
                        S.sway = Math.sin(t / 900) * .8;
                        S.msgT = 0;
                        S.dist += S.v * dt;
                        for (const f of S.ftrs)
                            f.z += (f.v - S.v) * dt;
                    }
                    curvePull = clamp(S.v * S.v * curve(S.pos + 50) * .08, -.13, .13);
                    scanNear();
                    S.flashT = Math.max(0, (S.flashT || 0) - dt);
                    S.msgT = Math.max(0, S.msgT - dt);
                    S.hornT = Math.max(0, S.hornT - dt);
                    renderScene();
                    renderSprites();
                    renderWires();
                    renderHeadlight();
                    renderRain();
                    renderFlash();
                    drawCab();
                    drawSAUT();
                    drawLED();
                    drawSpeedo();
                    renderHUD();
                    ctx.putImageData(img, 0, 0);
                    audioUpdate();
                    requestAnimationFrame(frame);
                }
                requestAnimationFrame(frame);
                updateMenuInfo();
            })();
        </script>
    </body>
</html>
